services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: noderegistry
      POSTGRES_PASSWORD: noderegistry
      POSTGRES_DB: noderegistry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noderegistry"]
      interval: 5s
      timeout: 5s
      retries: 5

  node-1:
    build: .
    environment:
      NODE_ID: 1
      PEERS: "http://node-2:8080,http://node-3:8080"
      DATABASE_URL: postgresql://noderegistry:noderegistry@db:5432/noderegistry
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  node-2:
    build: .
    environment:
      NODE_ID: 2
      PEERS: "http://node-1:8080,http://node-3:8080"
      DATABASE_URL: postgresql://noderegistry:noderegistry@db:5432/noderegistry
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

  node-3:
    build: .
    environment:
      NODE_ID: 3
      PEERS: "http://node-1:8080,http://node-2:8080"
      DATABASE_URL: postgresql://noderegistry:noderegistry@db:5432/noderegistry
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy
